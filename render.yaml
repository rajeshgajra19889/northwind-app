services:
  - type: web
    name: northwind-app
    runtime: static
    buildCommand: npm ci && node scripts/set-api-url.mjs && npm run build
    staticPublishPath: dist/northwind-app/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_URL
        value: https://northwind-backend.onrender.com
      - key: NODE_VERSION
        value: 24