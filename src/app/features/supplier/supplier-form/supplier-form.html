<h2>{{ isEdit() ? 'Edit Supplier' : 'New Supplier' }}</h2>

@if (loading()) {
  <div class="loading-spinner">Loading supplier details...</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset [disabled]="isFormDisabled()">
    <div class="form-grid">
      <label class="col-span-2">
        Company Name *
        <input formControlName="companyName" placeholder="e.g. Exotic Liquids" />
        @if (form.controls.companyName.hasError('required') && form.controls.companyName.touched) {
          <span class="error">Company name is required.</span>
        }
        @if (form.controls.companyName.hasError('maxlength')) {
          <span class="error">Maximum 40 characters allowed.</span>
        }
      </label>

      <label>
        Contact Name
        <input formControlName="contactName" placeholder="e.g. Charlotte Cooper" />
        @if (form.controls.contactName.hasError('maxlength')) {
          <span class="error">Maximum 30 characters allowed.</span>
        }
      </label>

      <label>
        Contact Title
        <input formControlName="contactTitle" placeholder="e.g. Purchasing Manager" />
        @if (form.controls.contactTitle.hasError('maxlength')) {
          <span class="error">Maximum 30 characters allowed.</span>
        }
      </label>

      <label class="col-span-2">
        Address
        <input formControlName="address" placeholder="e.g. 49 Gilbert St." />
        @if (form.controls.address.hasError('maxlength')) {
          <span class="error">Maximum 60 characters allowed.</span>
        }
      </label>

      <label>
        City
        <input formControlName="city" placeholder="e.g. London" />
        @if (form.controls.city.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <label>
        Region
        <input formControlName="region" placeholder="e.g. BC" />
        @if (form.controls.region.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <label>
        Postal Code
        <input formControlName="postalCode" placeholder="e.g. EC1 4SD" />
        @if (form.controls.postalCode.hasError('maxlength')) {
          <span class="error">Maximum 10 characters allowed.</span>
        }
      </label>

      <label>
        Country
        <input formControlName="country" placeholder="e.g. UK" />
        @if (form.controls.country.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <label>
        Phone
        <input formControlName="phone" placeholder="e.g. (171) 555-2222" />
        @if (form.controls.phone.hasError('maxlength')) {
          <span class="error">Maximum 24 characters allowed.</span>
        }
      </label>

      <label>
        Fax
        <input formControlName="fax" placeholder="e.g. (171) 555-2223" />
        @if (form.controls.fax.hasError('maxlength')) {
          <span class="error">Maximum 24 characters allowed.</span>
        }
      </label>

      <label class="col-span-2">
        Homepage
        <input formControlName="homepage" placeholder="e.g. https://company.com" />
        @if (form.controls.homepage.hasError('maxlength')) {
          <span class="error">Maximum 500 characters allowed.</span>
        }
      </label>
    </div>
  </fieldset>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" [disabled]="isInvalid() || isPending() || isFormDisabled()">
      @if (saving()) {
        Saving...
      } @else {
        {{ isEdit() ? 'Save Changes' : 'Create Supplier' }}
      }
    </button>
  </div>
</form>
