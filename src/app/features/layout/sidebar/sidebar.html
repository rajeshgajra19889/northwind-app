<aside class="sidebar">
    <ul>
        @for (group of navGroups; track group.title) {
        <div class="menu-title">{{ group.title }}</div>

        @for (link of group.links; track link.path) {
        <li>
            <a [routerLink]="link.path" routerLinkActive="active">
                {{ link.label }}
            </a>
        </li>
        }
        }


    </ul>
</aside>
