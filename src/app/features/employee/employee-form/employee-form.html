<h2>{{ isEdit() ? 'Edit Employee' : 'New Employee' }}</h2>

@if (loading()) {
  <div class="loading-spinner">Loading employee details...</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset [disabled]="isFormDisabled()">
    <div class="form-grid">
      <!-- First Name -->
      <label>
        First Name *
        <input formControlName="firstName" placeholder="e.g. Nancy" />
        @if (form.controls.firstName.hasError('required') && form.controls.firstName.touched) {
          <span class="error">First name is required.</span>
        }
        @if (form.controls.firstName.hasError('maxlength')) {
          <span class="error">Maximum 10 characters allowed.</span>
        }
      </label>

      <!-- Last Name -->
      <label>
        Last Name *
        <input formControlName="lastName" placeholder="e.g. Davolio" />
        @if (form.controls.lastName.hasError('required') && form.controls.lastName.touched) {
          <span class="error">Last name is required.</span>
        }
        @if (form.controls.lastName.hasError('maxlength')) {
          <span class="error">Maximum 20 characters allowed.</span>
        }
      </label>

      <!-- Title -->
      <label>
        Title
        <input formControlName="title" placeholder="e.g. Sales Representative" />
        @if (form.controls.title.hasError('maxlength')) {
          <span class="error">Maximum 30 characters allowed.</span>
        }
      </label>

      <!-- Title of Courtesy -->
      <label>
        Title of Courtesy
        <input formControlName="titleOfCourtesy" placeholder="e.g. Ms." />
        @if (form.controls.titleOfCourtesy.hasError('maxlength')) {
          <span class="error">Maximum 25 characters allowed.</span>
        }
      </label>

      <!-- Birth Date -->
      <label>
        Birth Date
        <input type="date" formControlName="birthDate" />
      </label>

      <!-- Hire Date -->
      <label>
        Hire Date
        <input type="date" formControlName="hireDate" />
      </label>

      <!-- Address -->
      <label class="col-span-2">
        Address
        <input formControlName="address" placeholder="e.g. 507 - 20th Ave. E. Apt. 2A" />
        @if (form.controls.address.hasError('maxlength')) {
          <span class="error">Maximum 60 characters allowed.</span>
        }
      </label>

      <!-- City -->
      <label>
        City
        <input formControlName="city" placeholder="e.g. Seattle" />
        @if (form.controls.city.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <!-- Region -->
      <label>
        Region
        <input formControlName="region" placeholder="e.g. WA" />
        @if (form.controls.region.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <!-- Postal Code -->
      <label>
        Postal Code
        <input formControlName="postalCode" placeholder="e.g. 98122" />
        @if (form.controls.postalCode.hasError('maxlength')) {
          <span class="error">Maximum 10 characters allowed.</span>
        }
      </label>

      <!-- Country -->
      <label>
        Country
        <input formControlName="country" placeholder="e.g. USA" />
        @if (form.controls.country.hasError('maxlength')) {
          <span class="error">Maximum 15 characters allowed.</span>
        }
      </label>

      <!-- Home Phone -->
      <label>
        Home Phone
        <input formControlName="homePhone" placeholder="e.g. (206) 555-9857" />
        @if (form.controls.homePhone.hasError('maxlength')) {
          <span class="error">Maximum 24 characters allowed.</span>
        }
      </label>

      <!-- Extension -->
      <label>
        Extension
        <input formControlName="extension" placeholder="e.g. 5467" />
        @if (form.controls.extension.hasError('maxlength')) {
          <span class="error">Maximum 4 characters allowed.</span>
        }
      </label>

      <!-- Reports To -->
      <label>
        Reports To (Employee ID)
        <input type="number" formControlName="reportsTo" />
      </label>

      <!-- Notes -->
      <label class="col-span-2">
        Notes
        <textarea formControlName="notes" rows="4" placeholder="Employee notes..."></textarea>
      </label>

      <!-- Photo Path -->
      <label class="col-span-2">
        Photo Path
        <input
          formControlName="photoPath"
          placeholder="e.g. http://accwebemmployeesdavolio.blob.core.windows.net/..."
        />
        @if (form.controls.photoPath.hasError('maxlength')) {
          <span class="error">Maximum 255 characters allowed.</span>
        }
      </label>
    </div>
  </fieldset>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" [disabled]="isInvalid() || isPending() || isFormDisabled()">
      @if (saving()) {
        Saving...
      } @else {
        {{ isEdit() ? 'Save Changes' : 'Create Employee' }}
      }
    </button>
  </div>
</form>
