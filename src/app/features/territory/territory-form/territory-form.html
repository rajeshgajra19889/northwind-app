<h2>{{ isEdit() ? 'Edit Territory' : 'New Territory' }}</h2>

@if (loading()) {
  <div class="loading-spinner">Loading territory details...</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset [disabled]="isFormDisabled()">
    <div class="form-grid">
      <label>
        Territory ID *
        <input formControlName="territoryId" placeholder="e.g. 01581" />
        @if (form.controls.territoryId.hasError('required') && form.controls.territoryId.touched) {
          <span class="error">Territory ID is required.</span>
        }
        @if (form.controls.territoryId.hasError('maxlength')) {
          <span class="error">Maximum 20 characters allowed.</span>
        }
      </label>

      <label>
        Region *
        <select formControlName="regionId">
          <option [ngValue]="null">-- Select Region --</option>
          @for (region of regions(); track region.regionId) {
            <option [ngValue]="region.regionId">{{ region.regionDescription }}</option>
          }
        </select>
        @if (form.controls.regionId.hasError('required') && form.controls.regionId.touched) {
          <span class="error">Region is required.</span>
        }
      </label>

      <label class="col-span-2">
        Territory Description *
        <input formControlName="territoryDescription" placeholder="e.g. Westboro" />
        @if (form.controls.territoryDescription.hasError('required') && form.controls.territoryDescription.touched) {
          <span class="error">Description is required.</span>
        }
        @if (form.controls.territoryDescription.hasError('maxlength')) {
          <span class="error">Maximum 60 characters allowed.</span>
        }
      </label>
    </div>
  </fieldset>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" [disabled]="isInvalid() || isPending() || isFormDisabled()">
      @if (saving()) {
        Saving...
      } @else {
        {{ isEdit() ? 'Save Changes' : 'Create Territory' }}
      }
    </button>
  </div>
</form>
