<h2>{{ isEdit() ? 'Edit Region' : 'New Region' }}</h2>

@if (loading()) {
  <div class="loading-spinner">Loading region details...</div>
}

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <fieldset [disabled]="isFormDisabled()">
    <div class="form-grid">
      <label class="col-span-2">
        Region Description *
        <input formControlName="regionDescription" placeholder="e.g. Eastern" />
        @if (form.controls.regionDescription.hasError('required') && form.controls.regionDescription.touched) {
          <span class="error">Region description is required.</span>
        }
        @if (form.controls.regionDescription.hasError('maxlength')) {
          <span class="error">Maximum 60 characters allowed.</span>
        }
      </label>
    </div>
  </fieldset>

  @if (errorMessage()) {
    <p class="error-message" role="alert">{{ errorMessage() }}</p>
  }

  <div class="actions">
    <button type="button" (click)="onCancel()" [disabled]="saving()">Cancel</button>
    <button type="submit" [disabled]="isInvalid() || isPending() || isFormDisabled()">
      @if (saving()) {
        Saving...
      } @else {
        {{ isEdit() ? 'Save Changes' : 'Create Region' }}
      }
    </button>
  </div>
</form>
